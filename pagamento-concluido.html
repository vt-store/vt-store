<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento concluído | VT Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #07080d;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      width: 100%;
      max-width: 500px;
      padding: 45px 30px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      background: #11141d;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #22c55e;
      font-size: 42px;
      font-weight: bold;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 30px;
    }

    p {
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    a {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 10px;
      background: #8b5cf6;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="icon">✓</div>

    <h1>Pagamento concluído!</h1>

    <p>
      Obrigado pela sua compra na VT Store.
      Seu pagamento foi recebido e seu pedido está sendo processado.
    </p>

    <a href="index.html">Voltar para a loja</a>
  </div>

</body>
</html>
