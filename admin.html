<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VT Store - Painel Administrativo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0d10;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      background: #0d1014;
      color: #fff;
      border: 1px solid #303640;
      border-radius: 9px;
      padding: 11px 12px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #8b5cf6;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-primary {
      background: #8b5cf6;
      color: #fff;
    }

    .btn-secondary {
      background: #292e36;
      color: #fff;
    }

    .btn-success {
      background: #198754;
      color: #fff;
    }

    .btn-danger {
      background: #dc3545;
      color: #fff;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #fff;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #d9dde3;
      font-size: 14px;
    }

    /* LOGIN */

    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #15181d;
      border: 1px solid #292e36;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .login-box h1 {
      margin: 0 0 8px;
      text-align: center;
    }

    .login-box p {
      text-align: center;
      color: #9da4af;
      margin-bottom: 28px;
    }

    .error {
      color: #ff7777;
      margin-top: 12px;
      font-size: 14px;
    }

    /* PAINEL */

    #panel {
      display: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,13,16,.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #242931;
    }

    .header-inner {
      max-width: 1500px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
    }

    .logo span {
      color: #8b5cf6;
    }

    main {
      max-width: 1500px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    /* ESTATÍSTICAS */

    .stats {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 25px;
    }

    .stat {
      background: #15181d;
      border: 1px solid #292e36;
      border-radius: 13px;
      padding: 18px;
    }

    .stat-title {
      color: #969eaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: 900;
    }

    /* SEÇÕES */

    .section {
      background: #15181d;
      border: 1px solid #292e36;
      border-radius: 14px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .section-header {
      padding: 18px 20px;
      border-bottom: 1px solid #292e36;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 18px;
    }

    /* NOVO PRODUTO */

    .new-product {
      padding: 20px;
    }

    .new-product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .new-product-grid .full {
      grid-column: 1 / -1;
    }

    .new-product-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .new-product-message {
      margin-top: 12px;
      font-size: 14px;
    }

    /* PEDIDOS */

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }

    th,
    td {
      padding: 13px 15px;
      border-bottom: 1px solid #252a31;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: #969eaa;
      font-size: 12px;
      text-transform: uppercase;
    }

    td {
      font-size: 14px;
    }

    tr:hover td {
      background: rgba(139,92,246,.025);
    }

    .status {
      min-width: 145px;
    }

    .delivery-badge {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 7px;
      background: #292e36;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .delivery-home {
      background: rgba(139,92,246,.16);
      color: #c4a7ff;
    }

    .delivery-pickup {
      background: rgba(25,135,84,.18);
      color: #72e0a5;
    }

    .shipping-price {
      color: #9da4af;
      font-size: 12px;
    }

    /* PRODUTOS */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      padding: 20px;
    }

    .product-card {
      background: #0e1115;
      border: 1px solid #292e36;
      border-radius: 13px;
      padding: 16px;
    }

    .product-card h3 {
      margin: 0 0 14px;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 10px;
      background: #181c22;
      margin-bottom: 12px;
    }

    .stock-row {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .stock-row button {
      width: 40px;
      padding: 10px 0;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .checkbox input {
      width: auto;
    }

    .media-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .media-item {
      position: relative;
    }

    .media-item img,
    .media-item video {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 7px;
      background: #111;
    }

    .media-delete {
      position: absolute;
      right: 5px;
      top: 5px;
      padding: 5px 8px;
      background: #dc3545;
      color: #fff;
      font-size: 12px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 850px;
      max-height: 90vh;
      overflow-y: auto;
      background: #15181d;
      border: 1px solid #303640;
      border-radius: 15px;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close {
      background: transparent;
      color: #fff;
      font-size: 24px;
      padding: 0 5px;
    }

    .order-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info-box {
      background: #0e1115;
      border: 1px solid #292e36;
      border-radius: 9px;
      padding: 12px;
    }

    .info-box small {
      display: block;
      color: #8e96a2;
      margin-bottom: 4px;
    }

    .info-box strong {
      word-break: break-word;
    }

    .order-items {
      margin-top: 18px;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #292e36;
    }

    .order-total {
      text-align: right;
      font-size: 22px;
      font-weight: 900;
      margin-top: 18px;
    }

    .shipping-box {
      margin-top: 18px;
      background: #0e1115;
      border: 1px solid #292e36;
      border-radius: 10px;
      padding: 15px;
    }

    .shipping-box h3 {
      margin: 0 0 12px;
    }

    .shipping-line {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      border-bottom: 1px solid #292e36;
    }

    .shipping-line:last-child {
      border-bottom: 0;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #8f97a3;
    }

    .small-muted {
      color: #8e96a2;
      font-size: 12px;
    }

    @media (max-width: 1100px) {
      .stats {
        grid-template-columns: repeat(3, 1fr);
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .new-product-grid {
        grid-template-columns: 1fr;
      }

      .new-product-grid .full {
        grid-column: auto;
      }

      .order-info {
        grid-template-columns: 1fr;
      }

      .header-inner {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="loginScreen" class="login">

    <div class="login-box">

      <h1>VT Store</h1>

      <p>Painel administrativo</p>

      <div class="field">

        <label for="adminKey">
          Chave administrativa
        </label>

        <input
          type="password"
          id="adminKey"
          placeholder="Digite sua chave"
          autocomplete="off"
        >

      </div>

      <button
        class="btn-primary"
        style="width:100%;"
        onclick="login()"
      >
        Entrar
      </button>

      <div
        id="loginError"
        class="error"
      ></div>

    </div>

  </div>


  <!-- PAINEL -->

  <div id="panel">

    <header>

      <div class="header-inner">

        <div class="logo">
          VT <span>STORE</span> — ADMIN
        </div>

        <button
          class="btn-danger"
          onclick="logout()"
        >
          Sair
        </button>

      </div>

    </header>


    <main>

      <!-- ESTATÍSTICAS -->

      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            Total de pedidos
          </div>

          <div
            id="statTotal"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Pendentes
          </div>

          <div
            id="statPending"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Pagos
          </div>

          <div
            id="statPaid"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Enviados
          </div>

          <div
            id="statShipped"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Entregues
          </div>

          <div
            id="statDelivered"
            class="stat-value"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            Total vendido
          </div>

          <div
            id="statRevenue"
            class="stat-value"
          >
            R$ 0,00
          </div>

        </div>

      </div>


      <!-- CADASTRAR PRODUTO -->

      <section class="section">

        <div class="section-header">

          <h2>
            ➕ Cadastrar novo produto
          </h2>

        </div>


        <div class="new-product">

          <div class="new-product-grid">

            <div class="field">

              <label>
                Nome do produto *
              </label>

              <input
                id="newProductName"
                type="text"
                placeholder="Ex: Xbox One S 1TB"
              >

            </div>


            <div class="field">

              <label>
                Categoria *
              </label>

              <input
                id="newProductCategory"
                type="text"
                placeholder="Ex: Xbox"
              >

            </div>


            <div class="field">

              <label>
                Preço *
              </label>

              <input
                id="newProductPrice"
                type="number"
                step="0.01"
                min="0"
                placeholder="Ex: 1000"
              >

            </div>


            <div class="field">

              <label>
                Estoque *
              </label>

              <input
                id="newProductStock"
                type="number"
                min="0"
                step="1"
                value="1"
              >

            </div>


            <div class="field full">

              <label>
                Descrição
              </label>

              <textarea
                id="newProductDescription"
                placeholder="Digite a descrição do produto..."
              ></textarea>

            </div>


            <div>

              <label class="checkbox">

                <input
                  type="checkbox"
                  id="newProductActive"
                  checked
                >

                Produto ativo

              </label>

            </div>


            <div>

              <label class="checkbox">

                <input
                  type="checkbox"
                  id="newProductPromotion"
                >

                Produto em promoção

              </label>

            </div>

          </div>


          <div class="new-product-actions">

            <button
              class="btn-success"
              onclick="createProduct()"
            >
              Criar produto
            </button>

            <button
              class="btn-secondary"
              onclick="clearNewProductForm()"
            >
              Limpar
            </button>

          </div>


          <div
            id="newProductMessage"
            class="new-product-message"
          ></div>

        </div>

      </section>


      <!-- PEDIDOS -->

      <section class="section">

        <div class="section-header">

          <h2>
            🛒 Pedidos
          </h2>

          <button
            class="btn-secondary"
            onclick="loadData()"
          >
            Atualizar
          </button>

        </div>


        <div class="table-wrapper">

          <table>

            <thead>

              <tr>

                <th>Pedido</th>
                <th>Cliente</th>
                <th>Entrega</th>
                <th>Endereço</th>
                <th>Produtos</th>
                <th>Frete</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Data</th>
                <th></th>

              </tr>

            </thead>


            <tbody id="ordersTable"></tbody>

          </table>

        </div>

      </section>


      <!-- PRODUTOS -->

      <section class="section">

        <div class="section-header">

          <h2>
            📦 Produtos cadastrados
          </h2>

        </div>


        <div
          id="productsGrid"
          class="products-grid"
        ></div>

      </section>

    </main>

  </div>


  <!-- MODAL PEDIDO -->

  <div
    id="orderModal"
    class="modal"
  >

    <div class="modal-content">

      <div class="modal-header">

        <h2>
          Detalhes do pedido
        </h2>

        <button
          class="close"
          onclick="closeOrderModal()"
        >
          ×
        </button>

      </div>


      <div id="orderDetails"></div>

    </div>

  </div>


<script>
"use strict";


const ADMIN_FUNCTION_URL =
  "https://knmwxyxgcgytzhggzhhd.supabase.co/functions/v1/admin-orders";


const WHATSAPP_NUMBER =
  "5515991713864";


let adminKey = "";

let products = [];
let productImages = [];
let productVideos = [];
let orders = [];


/* =========================================================
   LOGIN
========================================================= */

function login() {

  const input =
    document.getElementById("adminKey");

  const error =
    document.getElementById("loginError");

  adminKey =
    String(input.value || "").trim();


  if (!adminKey) {

    error.textContent =
      "Digite sua chave.";

    return;
  }


  error.textContent =
    "Verificando...";


  loadData();

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

  adminKey = "";

  products = [];
  productImages = [];
  productVideos = [];
  orders = [];


  document.getElementById("panel").style.display =
    "none";


  document.getElementById("loginScreen").style.display =
    "flex";


  document.getElementById("adminKey").value =
    "";


  document.getElementById("loginError").textContent =
    "";

}


/* =========================================================
   API
========================================================= */

async function apiRequest(options = {}) {

  const response =
    await fetch(
      ADMIN_FUNCTION_URL,
      {
        ...options,

        headers: {
          ...(options.headers || {}),
          "x-admin-key": adminKey
        }
      }
    );


  let data = null;


  try {

    data =
      await response.json();

  } catch (error) {

    throw new Error(
      "Resposta inválida do servidor."
    );

  }


  if (
    !response.ok ||
    data.success === false
  ) {

    throw new Error(
      data.error ||
      data.message ||
      "Erro na requisição."
    );

  }


  return data;

}


/* =========================================================
   CARREGAR DADOS
========================================================= */

async function loadData() {

  const loginError =
    document.getElementById("loginError");


  try {

    const data =
      await apiRequest({
        method: "GET"
      });


    orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];


    products =
      Array.isArray(data.products)
        ? data.products
        : [];


    productImages =
      Array.isArray(data.product_images)
        ? data.product_images
        : [];


    productVideos =
      Array.isArray(data.product_videos)
        ? data.product_videos
        : [];


    document.getElementById("loginScreen").style.display =
      "none";


    document.getElementById("panel").style.display =
      "block";


    renderStats();
    renderOrders();
    renderProducts();


  } catch (error) {

    console.error(error);


    document.getElementById("panel").style.display =
      "none";


    document.getElementById("loginScreen").style.display =
      "flex";


    loginError.textContent =
      error.message ||
      "Chave inválida ou erro ao conectar.";

  }

}


/* =========================================================
   CRIAR PRODUTO
========================================================= */

async function createProduct() {

  const message =
    document.getElementById(
      "newProductMessage"
    );


  const name =
    document.getElementById(
      "newProductName"
    ).value.trim();


  const category =
    document.getElementById(
      "newProductCategory"
    ).value.trim();


  const price =
    Number(
      document.getElementById(
        "newProductPrice"
      ).value || 0
    );


  const stock =
    Number(
      document.getElementById(
        "newProductStock"
      ).value || 0
    );


  const description =
    document.getElementById(
      "newProductDescription"
    ).value;


  const active =
    document.getElementById(
      "newProductActive"
    ).checked;


  const promotion =
    document.getElementById(
      "newProductPromotion"
    ).checked;


  if (!name) {

    message.style.color =
      "#ff7777";

    message.textContent =
      "Digite o nome do produto.";

    return;
  }


  if (!category) {

    message.style.color =
      "#ff7777";

    message.textContent =
      "Digite a categoria.";

    return;
  }


  if (
    !Number.isFinite(price) ||
    price < 0
  ) {

    message.style.color =
      "#ff7777";

    message.textContent =
      "Digite um preço válido.";

    return;
  }


  if (
    !Number.isInteger(stock) ||
    stock < 0
  ) {

    message.style.color =
      "#ff7777";

    message.textContent =
      "Digite um estoque válido.";

    return;
  }


  try {

    message.style.color =
      "#aaa";

    message.textContent =
      "Criando produto...";


    await apiRequest({

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          action:
            "create_product",

          name:
            name,

          category:
            category,

          description:
            description,

          price:
            price,

          stock:
            stock,

          active:
            active,

          promotion:
            promotion

        })

    });


    message.style.color =
      "#4ade80";

    message.textContent =
      "Produto criado com sucesso!";


    clearNewProductForm();


    await loadData();


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


  } catch (error) {

    console.error(error);

    message.style.color =
      "#ff7777";

    message.textContent =
      error.message ||
      "Erro ao criar produto.";

  }

}


/* =========================================================
   LIMPAR NOVO PRODUTO
========================================================= */

function clearNewProductForm() {

  document.getElementById(
    "newProductName"
  ).value = "";


  document.getElementById(
    "newProductCategory"
  ).value = "";


  document.getElementById(
    "newProductPrice"
  ).value = "";


  document.getElementById(
    "newProductStock"
  ).value = "1";


  document.getElementById(
    "newProductDescription"
  ).value = "";


  document.getElementById(
    "newProductActive"
  ).checked = true;


  document.getElementById(
    "newProductPromotion"
  ).checked = false;

}


/* =========================================================
   ESTATÍSTICAS
========================================================= */

function renderStats() {

  const total =
    orders.length;


  const pending =
    orders.filter(
      o => o.status === "pending"
    ).length;


  const paid =
    orders.filter(
      o => o.status === "paid"
    ).length;


  const shipped =
    orders.filter(
      o => o.status === "shipped"
    ).length;


  const delivered =

/* =========================================================
   ENTREGA
========================================================= */

function getDeliveryInfo(order) {

  const shipping =
    order.shipping ||
    order.shipping_data ||
    order.delivery ||
    null;


  const shippingId =
    shipping &&
    typeof shipping === "object"
      ? (
          shipping.id ||
          shipping.shipping_id ||
          ""
        )
      : "";


  const shippingName =
    shipping &&
    typeof shipping === "object"
      ? (
          shipping.name ||
          shipping.label ||
          ""
        )
      : "";


  if (
    shippingId === "vt-retirada" ||
    /retirada/i.test(
      shippingName
    ) ||
    (
      !order.customer_address &&
      !order.customer_cep &&
      Number(order.shipping_price || 0) === 0
    )
  ) {

    return {
      type: "pickup",
      label: "🎁 Retirada grátis",
      detail: "Itapetininga/SP"
    };

  }


  return {
    type: "delivery",
    label: "🚚 Receber em casa",
    detail:
      shippingName ||
      "Entrega"
  };

}


function getShippingPrice(order) {

  const possibleValues = [

    order.shipping_price,

    order.shipping_cost,

    order.freight,

    order.delivery_price,

    order.shipping_amount

  ];


  for (
    const value of possibleValues
  ) {

    const number =
      Number(value);


    if (
      Number.isFinite(number)
    ) {

      return number;

    }

  }


  const shipping =
    order.shipping;


  if (
    shipping &&
    typeof shipping === "object"
  ) {

    const number =
      Number(
        shipping.price ||
        shipping.amount ||
        shipping.cost ||
        0
      );


    if (
      Number.isFinite(number)
    ) {

      return number;

    }

  }


  /*
    Compatibilidade com pedidos antigos:

    Se o pedido não possui campo de frete,
    tentamos descobrir pelo total dos itens.
  */

  const items =
    parseItems(order.items);


  const itemsTotal =
    items.reduce(
      (sum, item) => {

        const quantity =
          Number(
            item.quantity || 1
          );

        const price =
          Number(
            item.price ||
            item.unit_price ||
            0
          );

        return sum +
          (price * quantity);

      },
      0
    );


  const total =
    Number(
      order.total || 0
    );


  const difference =
    total -
    itemsTotal;


  if (
    difference > 0.009
  ) {

    return difference;

  }


  return 0;

}

function statusOption(

}


async function changeOrderStatus(
  orderNsu,
  status
) {

  try {

    const confirmed =
      confirm(
        "Alterar o status deste pedido para:\n\n" +
        statusLabel(status) +
        "?"
      );


    if (!confirmed) {

      renderOrders();

      return;
    }


    await apiRequest({

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          action:
            "update_order_status",

          order_nsu:
            orderNsu,

          status:
            status

        })

    });


    await loadData();


  } catch (error) {

    alert(
      error.message ||
      "Não foi possível alterar o status."
    );

    renderOrders();

  }

}

function changeStock(
  productId,
  amount
) {

  const input =
    document.getElementById(
      "stock-" + productId
    );


  if (!input) {
    return;
  }


  let value =
    Number(
      input.value || 0
    );


  value += amount;


  if (value < 0) {
    value = 0;
  }

/* =========================================================

========================================================= */

async function saveProduct(
  productId
) {

  try {

    const name =
      document.getElementById(
        "name-" + productId
      ).value.trim();


    const category =
      document.getElementById(
        "category-" + productId
      ).value.trim();


    const description =
      document.getElementById(
        "description-" + productId
      ).value;


    const price =
      Number(
        document.getElementById(
          "price-" + productId
        ).value || 0
      );


    const stock =
      Number(
        document.getElementById(
          "stock-" + productId
        ).value || 0
      );


    const active =
      document.getElementById(
        "active-" + productId
      ).checked;


    const promotion =
      document.getElementById(
        "promotion-" + productId
      ).checked;


    if (!name) {

      alert(
        "Informe o nome do produto."
      );

      return;
    }


    await apiRequest({

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          action:
            "update_product",

          product_id:
            productId,

          name:
            name,

          category:
            category,

          description:
            description,

          price:
            price,

          stock:
            stock,

          active:
            active,

          promotion:
            promotion

        })

    });


    alert(
      "Produto atualizado com sucesso!"
    );


    await loadData();


  } catch (error) {

    console.error(error);

    alert(
      error.message ||
      "Erro ao salvar produto."
    );

  }

}

/* =========================================================
   WHATSAPP
========================================================= */

function normalizePhone(
  phone
) {

  if (!phone) {
    return "";
  }


  let number =
    String(phone)
      .replace(/\D/g, "");


  if (
    number.length === 10 ||
    number.length === 11
  ) {

    number =
      "55" + number;

  }


  return number;

}


function buildWhatsAppMessage(
  order
) {

  const delivery =
    getDeliveryInfo(order);


  const shippingPrice =
    getShippingPrice(order);


  let message =
    "Olá! Aqui é da VT Store.";


  message +=
    "\n\nSobre o seu pedido: " +
    (order.order_nsu || "");


  if (
    order.status === "paid"
  ) {

    message +=
      "\n\nSeu pagamento foi confirmado!";

  }


  if (
    order.status === "shipped"
  ) {

    message +=
      "\n\nSeu pedido foi enviado!";

  }


  if (
    order.status === "delivered"
  ) {

    message +=
      "\n\nSeu pedido foi marcado como entregue.";

  }


  message +=
    "\n\nForma de recebimento: " +
    delivery.label;


  if (
    delivery.type === "pickup"
  ) {

    message +=
      "\nLocal: Itapetininga/SP";

  } else {

    const address =
      [
        order.customer_address,
        order.customer_number,
        order.customer_complement,
        order.customer_neighborhood,
        order.customer_city,
        order.customer_state
      ]
      .filter(Boolean)
      .join(", ");


    if (address) {

      message +=
        "\nEndereço: " +
        address;

    }

  }


  message +=
    "\nFrete: " +
    (
      shippingPrice > 0
        ? formatMoney(
            shippingPrice
          )
        : "Grátis"
    );


  message +=
    "\nTotal: " +
    formatMoney(
      order.total
    );


  message +=
    "\n\nObrigado por comprar na VT Store!";


  return message;

}


/* =========================================================
   COPIAR PEDIDO
========================================================= */

async function copyOrder(
  orderNsu
) {

  const order =
    orders.find(
      o =>
        String(o.order_nsu) ===
        String(orderNsu)
    );


  if (!order) {
    return;
  }


  const items =
    parseItems(order.items);


  const delivery =
    getDeliveryInfo(order);


  const shippingPrice =
    getShippingPrice(order);


  const text =
    [

      "VT STORE",

      "",

      "PEDIDO: " +
        order.order_nsu,

      "",

      "Cliente: " +
        (order.customer_name || ""),

      "Telefone: " +
        (order.customer_phone || ""),

      "E-mail: " +
        (order.customer_email || ""),

      "",

      "FORMA DE RECEBIMENTO: " +
        delivery.label,

      "OPÇÃO: " +
        delivery.detail,

      "",

      "CEP: " +
        (order.customer_cep || ""),

      "Endereço: " +
        (order.customer_address || ""),

      "Número: " +
        (order.customer_number || ""),

      "Complemento: " +
        (order.customer_complement || ""),

      "Bairro: " +
        (order.customer_neighborhood || ""),

      "Cidade: " +
        (order.customer_city || ""),

      "Estado: " +
        (order.customer_state || ""),

      "",

      "PRODUTOS:",

      ...items.map(
        item =>
          "- " +
          (
            item.name ||
            item.product_name ||
            "Produto"
          ) +
          " x" +
          (item.quantity || 1)
      ),

      "",

      "FRETE: " +
        (
          shippingPrice > 0
            ? formatMoney(
                shippingPrice
              )
            : "Grátis"
        ),

      "TOTAL: " +
        formatMoney(
          order.total
        ),

      "",

      "STATUS: " +
        statusLabel(
          order.status
        )

    ].join("\n");


  try {

    await navigator.clipboard.writeText(
      text
    );


    alert(
      "Dados do pedido copiados!"
    );


  } catch (error) {

    alert(
      "Não foi possível copiar automaticamente."
    );

  }

}

/* =========================================================
   AUXILIARES
========================================================= */

function parseItems(
  items
) {

  if (Array.isArray(items)) {
    return items;
  }


  if (
    typeof items === "string"
  ) {

    try {

      const parsed =
        JSON.parse(items);


      return Array.isArray(parsed)
        ? parsed
        : [];

    } catch (error) {

      return [];

    }

  }


  return [];

}


function formatMoney(
  value
) {

  return Number(
    value || 0
  ).toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );

}


function formatDate(
  value
) {

  if (!value) {
    return "-";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "-";

  }


  return date.toLocaleString(
    "pt-BR"
  );

}


function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}


function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
  .replaceAll(
    "\\",
    "\\\\"
  )
  .replaceAll(
    "'",
    "\\'"
  )
  .replaceAll(
    "\n",
    "\\n"
  )
  .replaceAll(
    "\r",
    "\\r"
  );

}
