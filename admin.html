<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VT Store - Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0f;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111116;
  border-bottom: 1px solid #292930;
  padding: 20px;
}

header h1 {
  margin: 0;
}

.container {
  width: 95%;
  max-width: 1400px;
  margin: 25px auto;
}

.hidden {
  display: none !important;
}

.login {
  max-width: 420px;
  margin: 100px auto;
  padding: 30px;
  background: #15151b;
  border: 1px solid #292930;
  border-radius: 15px;
}

input,
textarea,
select {
  width: 100%;
  background: #0d0d12;
  color: white;
  border: 1px solid #303039;
  border-radius: 8px;
  padding: 11px;
  outline: none;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

label {
  display: block;
  margin: 12px 0 6px;
  color: #aaa;
  font-size: 13px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: bold;
}

.btn-primary {
  background: #5b5cff;
  color: white;
}

.btn-green {
  background: #18a558;
  color: white;
}

.btn-red {
  background: #d93636;
  color: white;
}

.btn-gray {
  background: #292930;
  color: white;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 25px;
}

.stat {
  background: #15151b;
  border: 1px solid #292930;
  border-radius: 14px;
  padding: 20px;
}

.stat small {
  color: #999;
}

.stat strong {
  display: block;
  font-size: 26px;
  margin-top: 8px;
}

.section {
  background: #111116;
  border: 1px solid #292930;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 25px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.section-title h2 {
  margin: 0;
}

.products-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(340px, 1fr));
  gap: 18px;
}

.product-card {
  background: #15151b;
  border: 1px solid #292930;
  border-radius: 15px;
  overflow: hidden;
}

.product-header {
  padding: 16px;
  border-bottom: 1px solid #292930;
}

.product-header h3 {
  margin: 0;
  font-size: 19px;
}

.product-id {
  margin-top: 6px;
  color: #666;
  font-size: 10px;
}

.media-title {
  padding: 12px 15px 0;
  color: #aaa;
  font-size: 13px;
  font-weight: bold;
}

.photos,
.videos {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 8px;
  padding: 12px;
}

.media-item {
  position: relative;
  background: #0d0d12;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #292930;
}

.media-item img,
.media-item video {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
}

.media-item video {
  background: black;
}

.delete-media {
  position: absolute;
  right: 5px;
  top: 5px;
  background: #d93636;
  color: white;
  padding: 5px 8px;
  font-size: 11px;
}

.no-media {
  grid-column: 1 / -1;
  text-align: center;
  padding: 20px;
  border: 1px dashed #333;
  border-radius: 8px;
  color: #777;
}

.product-body {
  padding: 16px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stock-control {
  display: flex;
  gap: 5px;
}

.stock-control button {
  width: 45px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.upload-box {
  margin-top: 15px;
  padding: 12px;
  border: 1px dashed #333;
  border-radius: 10px;
}

.upload-box input[type="file"] {
  border: 0;
  padding: 5px 0;
}

.active-box {
  display: flex;
  align-items: center;
  gap: 8px;
}

.active-box input {
  width: auto;
}

.orders {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1000px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #292930;
  text-align: left;
  vertical-align: top;
}

.status-select {
  width: 155px;
  padding: 8px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.status-select.pending {
  color: #ffcc66;
  border-color: #8a6d25;
}

.status-select.paid {
  color: #4be083;
  border-color: #267a4b;
}

.status-select.shipped {
  color: #66b3ff;
  border-color: #32658f;
}

.status-select.delivered {
  color: #7dff8b;
  border-color: #348c3d;
}

.status-select.cancelled {
  color: #ff7777;
  border-color: #8a3333;
}

.order-status-info {
  margin-top: 5px;
  font-size: 10px;
  color: #777;
}

@media(max-width:700px) {

  .stats {
    grid-template-columns: 1fr;
  }

  .row {
    grid-template-columns: 1fr;
  }

  .products-grid {
    grid-template-columns: 1fr;
  }

}

</style>
</head>

<body>

<header>
  <h1>VT Store — Painel Administrativo</h1>
</header>

<div id="loginScreen" class="login">

  <h2>Entrar no painel</h2>

  <label>Chave administrativa</label>

  <input
    type="password"
    id="adminKey"
    placeholder="Digite sua chave"
  >

  <button
    class="btn-primary"
    style="width:100%;margin-top:15px"
    onclick="login()"
  >
    Entrar
  </button>

  <div
    id="loginError"
    style="color:#ff7777;margin-top:15px"
  ></div>

</div>

<div
  id="panel"
  class="container hidden"
>

  <div class="stats">

    <div class="stat">
      <small>Total de pedidos</small>
      <strong id="totalOrders">0</strong>
    </div>

    <div class="stat">
      <small>Pedidos pagos</small>
      <strong id="paidOrders">0</strong>
    </div>

    <div class="stat">
      <small>Total vendido</small>
      <strong id="totalSales">
        R$ 0,00
      </strong>
    </div>

  </div>


  <!-- PEDIDOS -->

  <section class="section">

    <div class="section-title">

      <h2>📦 Pedidos</h2>

      <button
        class="btn-gray"
        onclick="loadData()"
      >
        Atualizar
      </button>

    </div>

    <div class="orders">

      <table>

        <thead>

          <tr>
            <th>Pedido</th>
            <th>Cliente</th>
            <th>Endereço</th>
            <th>Produtos</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Data</th>
          </tr>

        </thead>

        <tbody id="ordersBody"></tbody>

      </table>

    </div>

  </section>


  <!-- PRODUTOS -->

  <section class="section">

    <div class="section-title">

      <h2>🛒 Produtos</h2>

      <button
        class="btn-gray"
        onclick="loadData()"
      >
        Atualizar
      </button>

    </div>

    <div
      id="productsGrid"
      class="products-grid"
    ></div>

  </section>

</div>


<script>

const ADMIN_FUNCTION_URL =
  "https://knmwxyxgcgytzhggzhhd.supabase.co/functions/v1/admin-orders";

let adminKey = "";

let products = [];
let productImages = [];
let productVideos = [];
let orders = [];


/* LOGIN */

function login() {

  adminKey =
    document
      .getElementById("adminKey")
      .value
      .trim();

  if (!adminKey) {

    document
      .getElementById("loginError")
      .textContent =
        "Digite sua chave.";

    return;
  }

  loadData();
}


/* API */

async function apiRequest(options = {}) {

  const response =
    await fetch(
      ADMIN_FUNCTION_URL,
      {
        ...options,

        headers: {
          ...(options.headers || {}),
          "x-admin-key":
            adminKey
        }
      }
    );

  const data =
    await response.json();

  if (!response.ok ||
      data.success === false) {

    throw new Error(
      data.error ||
      "Erro na requisição."
    );
  }

  return data;
}


/* CARREGAR */

async function loadData() {

  try {

    const data =
      await apiRequest({
        method: "GET"
      });

    orders =
      data.orders || [];

    products =
      data.products || [];

    productImages =
      data.product_images || [];

    productVideos =
      data.product_videos || [];

    document
      .getElementById(
        "loginScreen"
      )
      .classList.add(
        "hidden"
      );

    document
      .getElementById(
        "panel"
      )
      .classList.remove(
        "hidden"
      );

    renderStats();
    renderOrders();
    renderProducts();

  } catch (error) {

    document
      .getElementById(
        "loginError"
      )
      .textContent =
        error.message;

  }
}


/* ESTATÍSTICAS */

function renderStats() {

  const paid =
    orders.filter(
      order =>
        order.status === "paid"
    );

  const sales =
    paid.reduce(
      (sum, order) =>
        sum +
        Number(
          order.total || 0
        ),
      0
    );

  document
    .getElementById(
      "totalOrders"
    )
    .textContent =
      orders.length;

  document
    .getElementById(
      "paidOrders"
    )
    .textContent =
      paid.length;

  document
    .getElementById(
      "totalSales"
    )
    .textContent =
      money(sales);
}


/* PEDIDOS */

function renderOrders() {

  const body =
    document.getElementById(
      "ordersBody"
    );

  body.innerHTML = "";

  orders.forEach(order => {

    const items =
      Array.isArray(
        order.items
      )
        ? order.items
        : [];

    const itemsText =
      items.map(item => {

        return (
          (item.name ||
           item.product_name ||
           "Produto") +
          " x" +
          (item.quantity || 1)
        );

      }).join("<br>");

    const tr =
      document.createElement(
        "tr"
      );


    const address = [
      order.customer_address,
      order.customer_number
        ? "Nº " +
          order.customer_number
        : "",
      order.customer_complement,
      order.customer_cep
        ? "CEP " +
          order.customer_cep
        : ""
    ]
      .filter(Boolean)
      .join(", ");


    const currentStatus =
      order.status || "pending";


    const statusLabels = {

      pending:
        "🟡 PENDENTE",

      paid:
        "🟢 PAGO",

      shipped:
        "📦 ENVIADO",

      delivered:
        "✅ ENTREGUE",

      cancelled:
        "🔴 CANCELADO"

    };


    const statusHtml = `

      <select
        class="status-select ${escapeAttribute(
          currentStatus
        )}"
        onchange="updateOrderStatus(
          '${escapeAttribute(
            order.order_nsu || ""
          )}',
          this.value
        )"
      >

        <option
          value="pending"
          ${
            currentStatus === "pending"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.pending}
        </option>

        <option
          value="paid"
          ${
            currentStatus === "paid"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.paid}
        </option>

        <option
          value="shipped"
          ${
            currentStatus === "shipped"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.shipped}
        </option>

        <option
          value="delivered"
          ${
            currentStatus === "delivered"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.delivered}
        </option>

        <option
          value="cancelled"
          ${
            currentStatus === "cancelled"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.cancelled}
        </option>

      </select>

      ${
        currentStatus === "paid"
          ? `
            <div class="order-status-info">
              Pagamento confirmado
            </div>
          `
          : ""
      }

    `;


    tr.innerHTML = `

      <td>
        ${escapeHtml(
          order.order_nsu || "-"
        )}
      </td>

      <td>
        <strong>
          ${escapeHtml(
            order.customer_name || "-"
          )}
        </strong>

        <br>

        ${escapeHtml(
          order.customer_email || ""
        )}

        <br>

        ${escapeHtml(
          order.customer_phone || ""
        )}
      </td>

      <td>
        ${escapeHtml(
          address || "-"
        )}
      </td>

      <td>
        ${itemsText || "-"}
      </td>

      <td>
        ${money(order.total)}
      </td>

      <td>
        ${statusHtml}
      </td>

      <td>
        ${formatDate(
          order.created_at
        )}
      </td>

    `;

    body.appendChild(tr);

  });

}


/* ATUALIZAR STATUS DO PEDIDO */

async function updateOrderStatus(
  orderNsu,
  status
) {

  if (!orderNsu) {

    alert(
      "❌ Número do pedido não encontrado."
    );

    await loadData();

    return;
  }


  const labels = {

    pending:
      "PENDENTE",

    paid:
      "PAGO",

    shipped:
      "ENVIADO",

    delivered:
      "ENTREGUE",

    cancelled:
      "CANCELADO"

  };


  const confirmChange =
    confirm(
      "Alterar o pedido " +
      orderNsu +
      " para " +
      (
        labels[status] ||
        status
      ) +
      "?"
    );


  if (!confirmChange) {

    await loadData();

    return;
  }


  try {

    await apiRequest({

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          action:
            "update_order_status",

          order_nsu:
            orderNsu,

          status:
            status

        })

    });


    alert(
      "✅ Status atualizado para " +
      (
        labels[status] ||
        status
      ) +
      "!"
    );


    await loadData();


  } catch(error) {

    alert(
      "❌ " +
      error.message
    );


    await loadData();

  }

}


/* PRODUTOS */

function renderProducts() {

  const grid =
    document.getElementById(
      "productsGrid"
    );

  grid.innerHTML = "";

  products.forEach(product => {

    grid.appendChild(
      createProductCard(
        product
      )
    );

  });

}


/* CARD */

function createProductCard(
  product
) {

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "product-card";

  const images =
    productImages.filter(
      image =>
        String(
          image.product_id
        ) ===
        String(
          product.id
        )
    );

  const videos =
    productVideos.filter(
      video =>
        String(
          video.product_id
        ) ===
        String(
          product.id
        )
    );


  const photosHtml =
    images.length

      ? images.map(image => `

        <div class="media-item">

          <img
            src="${escapeAttribute(
              image.image_url
            )}"
          >

          <button
            class="delete-media"
            onclick="deleteImage(
              '${escapeAttribute(
                product.id
              )}',
              '${escapeAttribute(
                image.image_url
              )}'
            )"
          >
            X
          </button>

        </div>

      `).join("")

      : `
        <div class="no-media">
          Nenhuma foto cadastrada
        </div>
      `;


  const videosHtml =
    videos.length

      ? videos.map(video => `

        <div class="media-item">

          <video
            src="${escapeAttribute(
              video.video_url
            )}"
            controls
            preload="metadata"
          ></video>

          <button
            class="delete-media"
            onclick="deleteVideo(
              '${escapeAttribute(
                product.id
              )}',
              '${escapeAttribute(
                video.video_url
              )}'
            )"
          >
            X
          </button>

        </div>

      `).join("")

      : `
        <div class="no-media">
          Nenhum vídeo cadastrado
        </div>
      `;


  card.innerHTML = `

    <div class="product-header">

      <h3>
        ${escapeHtml(
          product.name ||
          "Produto sem nome"
        )}
      </h3>

      <div class="product-id">
        ID:
        ${escapeHtml(
          product.id
        )}
      </div>

    </div>


    <div class="media-title">
      📸 FOTOS
    </div>

    <div class="photos">
      ${photosHtml}
    </div>


    <div class="media-title">
      🎥 VÍDEOS
    </div>

    <div class="videos">
      ${videosHtml}
    </div>


    <div class="product-body">

      <label>Nome</label>

      <input
        id="name-${product.id}"
        value="${escapeAttribute(
          product.name || ""
        )}"
      >


      <label>Categoria</label>

      <input
        id="category-${product.id}"
        value="${escapeAttribute(
          product.category || ""
        )}"
      >


      <label>Descrição</label>

      <textarea
        id="description-${product.id}"
      >${escapeHtml(
        product.description || ""
      )}</textarea>


      <div class="row">

        <div>

          <label>Preço</label>

          <input
            type="number"
            step="0.01"
            min="0"
            id="price-${product.id}"
            value="${Number(
              product.price || 0
            ).toFixed(2)}"
          >

        </div>


        <div>

          <label>Estoque</label>

          <div class="stock-control">

            <button
              class="btn-red"
              onclick="changeStock(
                '${product.id}',
                -1
              )"
            >
              −
            </button>

            <input
              type="number"
              min="0"
              id="stock-${product.id}"
              value="${Number(
                product.stock || 0
              )}"
            >

            <button
              class="btn-green"
              onclick="changeStock(
                '${product.id}',
                1
              )"
            >
              +
            </button>

          </div>

        </div>

      </div>


      <div class="active-box">

        <input
          type="checkbox"
          id="active-${product.id}"
          ${
            product.active
              ? "checked"
              : ""
          }
        >

        <span>
          Produto ativo
        </span>

      </div>


      <div class="active-box">

        <input
          type="checkbox"
          id="promotion-${product.id}"
          ${
            product.promotion
              ? "checked"
              : ""
          }
        >

        <span>
          Produto em promoção
        </span>

      </div>


      <div class="actions">

        <button
          class="btn-primary"
          onclick="saveProduct(
            '${product.id}'
          )"
        >
          💾 Salvar produto
        </button>

      </div>


      <!-- FOTO -->

      <div class="upload-box">

        <label>
          📸 Adicionar foto
        </label>

        <input
          type="file"
          accept="image/*"
          id="image-${product.id}"
        >

        <button
          class="btn-green"
          style="width:100%;margin-top:10px"
          onclick="uploadImage(
            '${product.id}'
          )"
        >
          Enviar foto
        </button>

      </div>


      <!-- VIDEO -->

      <div class="upload-box">

        <label>
          🎥 Adicionar vídeo
        </label>

        <input
          type="file"
          accept="video/*"
          id="video-${product.id}"
        >

        <button
          class="btn-green"
          style="width:100%;margin-top:10px"
          onclick="uploadVideo(
            '${product.id}'
          )"
        >
          Enviar vídeo
        </button>

      </div>

    </div>

  `;

  return card;
}


/* ESTOQUE */

function changeStock(
  productId,
  amount
) {

  const input =
    document.getElementById(
      `stock-${productId}`
    );

  let value =
    Number(
      input.value || 0
    );

  value += amount;

  if (value < 0) {
    value = 0;
  }

  input.value = value;
}


/* SALVAR */

async function saveProduct(
  productId
) {

  try {

    await apiRequest({

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          action:
            "update_product",

          product_id:
            productId,

          name:
            document.getElementById(
              `name-${productId}`
            ).value,

          category:
            document.getElementById(
              `category-${productId}`
            ).value,

          description:
            document.getElementById(
              `description-${productId}`
            ).value,

          price:
            Number(
              document.getElementById(
                `price-${productId}`
              ).value
            ),

          stock:
            Number(
              document.getElementById(
                `stock-${productId}`
              ).value
            ),

          active:
            document.getElementById(
              `active-${productId}`
            ).checked,

          promotion:
            document.getElementById(
              `promotion-${productId}`
            ).checked

        })

    });

    alert(
      "✅ Produto atualizado!"
    );

    await loadData();

  } catch(error) {

    alert(
      "❌ " +
      error.message
    );

  }
}


/* UPLOAD FOTO */

async function uploadImage(
  productId
) {

  const input =
    document.getElementById(
      `image-${productId}`
    );

  if (!input.files.length) {

    alert(
      "Selecione uma foto."
    );

    return;
  }

  const formData =
    new FormData();

  formData.append(
    "action",
    "upload_image"
  );

  formData.append(
    "product_id",
    productId
  );

  formData.append(
    "file",
    input.files[0]
  );

  try {

    await apiRequest({

      method: "POST",

      body: formData

    });

    alert(
      "✅ Foto enviada!"
    );

/* UPLOAD VIDEO */

async function uploadVideo(
  productId
) {

  const input =
    document.getElementById(
      `video-${productId}`
    );

  if (!input.files.length) {

    alert(
      "Selecione um vídeo."
    );

    return;
  }

  const file =
    input.files[0];

  if (
    !file.type.startsWith(
      "video/"
    )
  ) {

    alert(
      "Selecione um arquivo de vídeo."
    );

    return;
  }

  if (
    file.size >
    50 * 1024 * 1024
  ) {

    alert(
      "O vídeo pode ter no máximo 50 MB."
    );

    return;
  }

  const formData =
    new FormData();

  formData.append(
    "action",
    "upload_video"
  );

  formData.append(
    "product_id",
    productId
  );

  formData.append(
    "file",
    file
  );

  try {

    await apiRequest({

      method: "POST",

      body: formData

    });

    alert(
      "✅ Vídeo enviado!"
    );

    await loadData();

  } catch(error) {

    alert(
      "❌ " +
      error.message
    );

  }
}

/* UTILIDADES */

function money(value) {

  return Number(
    value || 0
  ).toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );
}

function formatDate(date) {

  if (!date) {
    return "-";
  }

  return new Date(
    date
  ).toLocaleString(
    "pt-BR"
  );
}

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

function escapeAttribute(value) {
  return escapeHtml(value);
}
