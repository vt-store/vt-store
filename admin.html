<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VT Store — Administração</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      min-height: 100vh;
    }

    .admin-page {
      padding: 45px 0 80px;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 30px;
    }

    .admin-header h1 {
      font-size: 32px;
    }

    .admin-header p {
      color: var(--muted);
      margin-top: 5px;
    }

    .admin-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .admin-card h2 {
      margin-bottom: 20px;
    }

    .login-box {
      width: min(430px, 92%);
      margin: 100px auto;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-logo h1 {
      font-size: 38px;
    }

    .login-logo span {
      color: var(--purple2);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #cfd2dc;
      font-size: 14px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0b0d13;
      color: white;
      outline: none;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(124, 60, 255, .12);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin: 18px 0;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      color: #ccc;
    }

    .checkbox-group input {
      accent-color: var(--purple);
    }

    .admin-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-danger {
      background: #35131b;
      border: 1px solid #6c2635;
      color: #ff8295;
    }

    .btn-danger:hover {
      background: #4a1723;
    }

    .btn-gray {
      background: #1b1f29;
      border: 1px solid var(--border);
      color: white;
    }

    .admin-products {
      display: grid;
      gap: 12px;
    }

    .admin-product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 17px;
      background: #0d1017;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .admin-product-info {
      min-width: 0;
    }

    .admin-product-info h3 {
      font-size: 17px;
      margin-bottom: 4px;
    }

    .admin-product-info p {
      color: var(--muted);
      font-size: 13px;
    }

    .admin-product-price {
      color: #c49dff;
      font-weight: 900;
      margin-top: 5px;
    }

    .admin-product-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      margin-top: 7px;
    }

    .status.active {
      background: rgba(32, 216, 120, .12);
      color: #54e89b;
    }

    .status.inactive {
      background: rgba(255, 77, 103, .12);
      color: #ff7185;
    }

    .message {
      display: none;
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: rgba(32, 216, 120, .1);
      border: 1px solid rgba(32, 216, 120, .25);
      color: #64e9a3;
    }

    .message.error {
      display: block;
      background: rgba(255, 77, 103, .1);
      border: 1px solid rgba(255, 77, 103, .25);
      color: #ff8193;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {

      .form-grid {
        grid-template-columns: 1fr;
      }

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-product {
        align-items: flex-start;
        flex-direction: column;
      }

      .admin-product-actions {
        width: 100%;
      }

      .admin-product-actions .btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <section id="loginSection">

    <div class="login-box">

      <div class="login-logo">
        <h1>VT<span>STORE</span></h1>
        <p style="color: var(--muted);">
          Painel administrativo
        </p>
      </div>

      <div class="admin-card">

        <div id="loginMessage" class="message"></div>

        <div class="form-group">
          <label for="loginEmail">
            E-mail
          </label>

          <input
            type="email"
            id="loginEmail"
            placeholder="Seu e-mail"
          >
        </div>

        <div class="form-group">
          <label for="loginPassword">
            Senha
          </label>

          <input
            type="password"
            id="loginPassword"
            placeholder="Sua senha"
          >
        </div>

        <button
          id="loginButton"
          class="btn btn-primary"
          style="width: 100%;"
        >
          Entrar no painel
        </button>

      </div>

    </div>

  </section>


  <!-- PAINEL -->

  <section id="adminSection" class="admin-page hidden">

    <div class="container">

      <div class="admin-header">

        <div>
          <h1>Painel VT Store</h1>

          <p>
            Gerencie seus produtos, preços e estoque.
          </p>
        </div>

        <div class="admin-actions">

          <a
            href="index.html"
            class="btn btn-gray"
          >
            Ver loja
          </a>

          <button
            id="logoutButton"
            class="btn btn-danger"
          >
            Sair
          </button>

        </div>

      </div>


      <!-- FORMULÁRIO -->

      <div class="admin-card">

        <h2 id="formTitle">
          Adicionar produto
        </h2>

        <div id="productMessage" class="message"></div>

        <input
          type="hidden"
          id="productId"
        >

        <div class="form-grid">

          <div class="form-group">

            <label>
              Nome do produto
            </label>

            <input
              type="text"
              id="productName"
              placeholder="Ex: Xbox One S 1TB"
            >

          </div>


          <div class="form-group">

            <label>
              Categoria
            </label>

            <select id="productCategory">

              <option value="Xbox">
                Xbox
              </option>

              <option value="PlayStation">
                PlayStation
              </option>

              <option value="iPhone">
                iPhone
              </option>

            </select>

          </div>

        </div>


        <div class="form-group">

          <label>
            Descrição
          </label>

          <textarea
            id="productDescription"
            placeholder="Descrição do produto..."
          ></textarea>

        </div>


        <div class="form-grid">

          <div class="form-group">

            <label>
              Preço
            </label>

            <input
              type="number"
              id="productPrice"
              step="0.01"
              min="0"
              placeholder="0,00"
            >

          </div>


          <div class="form-group">

            <label>
              Estoque
            </label>

            <input
              type="number"
              id="productStock"
              min="0"
              placeholder="0"
            >

          </div>

        </div>


        <div class="form-group">

  <label>
    Fotos do produto
  </label>

  <input
    type="file"
    id="productImages"
    accept="image/*"
    multiple
  >

  <small style="display:block; margin-top:8px; color:var(--muted);">
    Você pode selecionar várias fotos de uma vez.
  </small>

  <div
    id="imagePreview"
    style="
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
      gap:10px;
      margin-top:15px;
    "
  ></div>

</div>


        <div class="checkbox-group">

          <label>
            <input
              type="checkbox"
              id="productPromotion"
            >

            Produto em promoção
          </label>


          <label>
            <input
              type="checkbox"
              id="productActive"
              checked
            >

            Produto visível na loja
          </label>

        </div>


        <div class="admin-actions">

          <button
            id="saveProductButton"
            class="btn btn-primary"
          >
            Salvar produto
          </button>

          <button
            id="cancelEditButton"
            class="btn btn-gray hidden"
          >
            Cancelar edição
          </button>

        </div>

      </div>


      <!-- PRODUTOS -->

      <div class="admin-card">

        <h2>
          Produtos cadastrados
        </h2>

        <div
          id="adminProducts"
          class="admin-products"
        >

          <p style="color: var(--muted);">
            Carregando produtos...
          </p>

        </div>

      </div>

    </div>

  </section>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="config.js"></script>

  <script src="admin.js"></script>

</body>

</html>
