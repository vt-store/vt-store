<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VT Store | Pedidos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080812;
      color: #fff;
      padding: 30px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 30px;
    }

    .subtitle {
      color: #aaa;
      margin-top: 6px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    #loginBox {
      max-width: 450px;
      margin: 100px auto;
      background: #11111f;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #252540;
    }

    #loginBox h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #30304a;
      background: #080812;
      color: white;
      outline: none;
    }

    .primary {
      width: 100%;
      background: #7c3aed;
      color: white;
    }

    .primary:hover {
      background: #6d28d9;
    }

    .dashboard {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: #11111f;
      border: 1px solid #252540;
      border-radius: 15px;
      padding: 20px;
    }

    .card span {
      color: #aaa;
      font-size: 14px;
    }

    .card strong {
      display: block;
      font-size: 26px;
      margin-top: 8px;
    }

    .table-container {
      background: #11111f;
      border: 1px solid #252540;
      border-radius: 15px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1150px;
    }

    th,
    td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #252540;
      vertical-align: top;
    }

    th {
      color: #aaa;
      font-size: 13px;
      text-transform: uppercase;
    }

    tr:hover {
      background: #151527;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .paid {
      background: #064e3b;
      color: #6ee7b7;
    }

    .pending {
      background: #713f12;
      color: #fde68a;
    }

    .cancelled {
      background: #7f1d1d;
      color: #fecaca;
    }

    .items {
      color: #ccc;
      line-height: 1.6;
    }

    .customer-info {
      line-height: 1.6;
      min-width: 220px;
    }

    .customer-info small {
      color: #bbb;
    }

    .address {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #252540;
      color: #ddd;
    }

    .address strong {
      color: #fff;
    }

    .refresh {
      background: #222238;
      color: white;
    }

    .logout {
      background: #7f1d1d;
      color: white;
    }

    .message {
      color: #fca5a5;
      margin-top: 10px;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: #aaa;
    }

    @media (max-width: 700px) {
      body {
        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div id="loginBox">

    <h2>VT Store Admin</h2>

    <p class="subtitle">
      Acesso ao painel de pedidos
    </p>

    <br>

    <input
      id="adminKey"
      type="password"
      placeholder="Digite sua chave administrativa"
    >

    <button
      class="primary"
      onclick="login()"
    >
      Entrar
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>


  <div
    id="dashboard"
    class="dashboard"
  >

    <div class="container">

      <header>

        <div>
          <h1>📦 Pedidos VT Store</h1>

          <p class="subtitle">
            Controle de vendas e pagamentos
          </p>
        </div>

        <div>

          <button
            class="refresh"
            onclick="loadOrders()"
          >
            🔄 Atualizar
          </button>

          <button
            class="logout"
            onclick="logout()"
          >
            Sair
          </button>

        </div>

      </header>


      <div class="stats">

        <div class="card">

          <span>
            Total de pedidos
          </span>

          <strong id="totalOrders">
            0
          </strong>

        </div>


        <div class="card">

          <span>
            Pedidos pagos
          </span>

          <strong id="paidOrders">
            0
          </strong>

        </div>


        <div class="card">

          <span>
            Total vendido
          </span>

          <strong id="totalSales">
            R$ 0,00
          </strong>

        </div>

      </div>


      <div class="table-container">

        <table>

          <thead>

            <tr>

              <th>
                Pedido
              </th>

              <th>
                Cliente
              </th>

              <th>
                Endereço
              </th>

              <th>
                Produtos
              </th>

              <th>
                Valor
              </th>

              <th>
                Status
              </th>

              <th>
                Data
              </th>

            </tr>

          </thead>

          <tbody id="ordersTable">

          </tbody>

        </table>

      </div>

    </div>

  </div>


<script>

const ADMIN_FUNCTION_URL =
  "https://knmwxyxgcgytzhggzhhd.supabase.co/functions/v1/admin-orders";


let adminKey =
  sessionStorage.getItem("vt_admin_key");


function money(value) {

  return Number(value || 0)
    .toLocaleString(
      "pt-BR",
      {
        style: "currency",
        currency: "BRL"
      }
    );

}


async function login() {

  const input =
    document.getElementById(
      "adminKey"
    );

  const key =
    input.value.trim();

  if (!key) {

    document.getElementById(
      "loginMessage"
    ).textContent =
      "Digite sua chave.";

    return;

  }

  adminKey = key;

  try {

    const response =
      await fetch(
        ADMIN_FUNCTION_URL,
        {
          headers: {
            "x-admin-key":
              adminKey
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Acesso negado"
      );

    }

    sessionStorage.setItem(
      "vt_admin_key",
      adminKey
    );

    document.getElementById(
      "loginBox"
    ).style.display = "none";

    document.getElementById(
      "dashboard"
    ).style.display = "block";

    renderOrders(
      data.orders || []
    );

  } catch (error) {

    document.getElementById(
      "loginMessage"
    ).textContent =
      error.message;

  }

}


async function loadOrders() {

  try {

    const response =
      await fetch(
        ADMIN_FUNCTION_URL,
        {
          headers: {
            "x-admin-key":
              adminKey
          }
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Erro ao carregar pedidos"
      );

    }

    renderOrders(
      data.orders || []
    );

  } catch (error) {

    alert(
      error.message
    );

  }

}


function renderOrders(orders) {

  const table =
    document.getElementById(
      "ordersTable"
    );

  table.innerHTML = "";


  const paidOrders =
    orders.filter(
      order =>
        order.status === "paid"
    );


  const totalSales =
    paidOrders.reduce(
      (sum, order) =>
        sum +
        Number(order.total || 0),
      0
    );


  document.getElementById(
    "totalOrders"
  ).textContent =
    orders.length;


  document.getElementById(
    "paidOrders"
  ).textContent =
    paidOrders.length;


  document.getElementById(
    "totalSales"
  ).textContent =
    money(totalSales);


  if (!orders.length) {

    table.innerHTML = `
      <tr>
        <td
          colspan="7"
          class="empty"
        >
          Nenhum pedido encontrado.
        </td>
      </tr>
    `;

    return;

  }


  orders.forEach(
    order => {

      const items =
        Array.isArray(order.items)
          ? order.items
          : [];


      const itemsHtml =
        items.map(
          item => {

            const quantity =
              Number(
                item.quantity || 1
              );

            const name =
              item.name ||
              item.description ||
              "Produto";

            return `
              ${quantity}x ${escapeHtml(name)}
            `;

          }
        ).join("<br>");


      const status =
        order.status ||
        "pending";


      const statusText =
        status === "paid"
          ? "PAGO"
          : status === "pending"
            ? "PENDENTE"
            : status.toUpperCase();


      const date =
        order.created_at
          ? new Date(
              order.created_at
            ).toLocaleString(
              "pt-BR"
            )
          : "-";


      const fullAddress = [

        order.customer_address,

        order.customer_number
          ? `Nº ${order.customer_number}`
          : "",

        order.customer_complement,

        order.customer_cep
          ? `CEP: ${order.customer_cep}`
          : ""

      ]
        .filter(Boolean)
        .join(", ");


      const row =
        document.createElement(
          "tr"
        );


      row.innerHTML = `

        <td>

          <strong>
            ${escapeHtml(
              order.order_nsu || "-"
            )}
          </strong>

        </td>


        <td>

          <div class="customer-info">

            <strong>
              ${escapeHtml(
                order.customer_name ||
                "Não informado"
              )}
            </strong>

            <br>

            <small>
              📧 ${escapeHtml(
                order.customer_email ||
                "Não informado"
              )}
            </small>

            <br>

            <small>
              📱 ${escapeHtml(
                order.customer_phone ||
                "Não informado"
              )}
            </small>

          </div>

        </td>


        <td>

          <div class="customer-info">

            ${
              fullAddress
                ? `
                  <div class="address">
                    🏠 <strong>Entrega</strong><br>
                    ${escapeHtml(fullAddress)}
                  </div>
                `
                : `
                  <small>
                    Endereço não informado
                  </small>
                `
            }

          </div>

        </td>


        <td class="items">

          ${itemsHtml || "-"}

        </td>


        <td>

          <strong>
            ${money(
              order.total
            )}
          </strong>

        </td>


        <td>

          <span
            class="status ${escapeHtml(status)}"
          >
            ${escapeHtml(statusText)}
          </span>

        </td>


        <td>

          ${date}

        </td>

      `;


      table.appendChild(
        row
      );

    }
  );

}


function escapeHtml(value) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function logout() {

  sessionStorage.removeItem(
    "vt_admin_key"
  );

  location.reload();

}


if (adminKey) {

  document.getElementById(
    "loginBox"
  ).style.display = "none";

  document.getElementById(
    "dashboard"
  ).style.display = "block";

  loadOrders();

}

</script>

</body>
</html>
