<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VT Store - Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0f;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111116;
  border-bottom: 1px solid #292930;
  padding: 20px;
}

header h1 {
  margin: 0;
}

.container {
  width: 95%;
  max-width: 1400px;
  margin: 25px auto;
}

.hidden {
  display: none !important;
}

.login {
  max-width: 420px;
  margin: 100px auto;
  padding: 30px;
  background: #15151b;
  border: 1px solid #292930;
  border-radius: 15px;
}

input,
textarea,
select {
  width: 100%;
  background: #0d0d12;
  color: white;
  border: 1px solid #303039;
  border-radius: 8px;
  padding: 11px;
  outline: none;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

label {
  display: block;
  margin: 12px 0 6px;
  color: #aaa;
  font-size: 13px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: bold;
}

.btn-primary {
  background: #5b5cff;
  color: white;
}

.btn-green {
  background: #18a558;
  color: white;
}

.btn-red {
  background: #d93636;
  color: white;
}

.btn-gray {
  background: #292930;
  color: white;
}


/* =========================================================
   ESTATÍSTICAS
   ========================================================= */

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 15px;
  margin-bottom: 25px;
}

.stat {
  background: #15151b;
  border: 1px solid #292930;
  border-radius: 14px;
  padding: 18px;
  min-height: 105px;
}

.stat small {
  color: #999;
  display: block;
  font-size: 13px;
}

.stat strong {
  display: block;
  font-size: 26px;
  margin-top: 8px;
}

.stat-icon {
  font-size: 25px;
  margin-bottom: 8px;
}

.stat.pending {
  border-color: #6f5a24;
}

.stat.paid {
  border-color: #236c42;
}

.stat.shipped {
  border-color: #285b80;
}

.stat.delivered {
  border-color: #32703a;
}

.stat.cancelled {
  border-color: #733232;
}

.stat.sales {
  border-color: #5b5cff;
}


/* =========================================================
   SEÇÕES
   ========================================================= */

.section {
  background: #111116;
  border: 1px solid #292930;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 25px;
}

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.section-title h2 {
  margin: 0;
}


/* =========================================================
   PRODUTOS
   ========================================================= */

.products-grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fill, minmax(340px, 1fr));
  gap: 18px;
}

.product-card {
  background: #15151b;
  border: 1px solid #292930;
  border-radius: 15px;
  overflow: hidden;
}

.product-header {
  padding: 16px;
  border-bottom: 1px solid #292930;
}

.product-header h3 {
  margin: 0;
  font-size: 19px;
}

.product-id {
  margin-top: 6px;
  color: #666;
  font-size: 10px;
}

.media-title {
  padding: 12px 15px 0;
  color: #aaa;
  font-size: 13px;
  font-weight: bold;
}

.photos,
.videos {
  display: grid;
  grid-template-columns:
    repeat(3, 1fr);
  gap: 8px;
  padding: 12px;
}

.media-item {
  position: relative;
  background: #0d0d12;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid #292930;
}

.media-item img,
.media-item video {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
}

.media-item video {
  background: black;
}

.delete-media {
  position: absolute;
  right: 5px;
  top: 5px;
  background: #d93636;
  color: white;
  padding: 5px 8px;
  font-size: 11px;
}

.no-media {
  grid-column: 1 / -1;
  text-align: center;
  padding: 20px;
  border: 1px dashed #333;
  border-radius: 8px;
  color: #777;
}

.product-body {
  padding: 16px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.stock-control {
  display: flex;
  gap: 5px;
}

.stock-control button {
  width: 45px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.upload-box {
  margin-top: 15px;
  padding: 12px;
  border: 1px dashed #333;
  border-radius: 10px;
}

.upload-box input[type="file"] {
  border: 0;
  padding: 5px 0;
}

.active-box {
  display: flex;
  align-items: center;
  gap: 8px;
}

.active-box input {
  width: auto;
}


/* =========================================================
   PEDIDOS
   ========================================================= */

.orders {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 1120px;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #292930;
  text-align: left;
  vertical-align: top;
}

.status-select {
  width: 155px;
  padding: 8px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.status-select.pending {
  color: #ffcc66;
  border-color: #8a6d25;
}

.status-select.paid {
  color: #4be083;
  border-color: #267a4b;
}

.status-select.shipped {
  color: #66b3ff;
  border-color: #32658f;
}

.status-select.delivered {
  color: #7dff8b;
  border-color: #348c3d;
}

.status-select.cancelled {
  color: #ff7777;
  border-color: #8a3333;
}

.order-status-info {
  margin-top: 5px;
  font-size: 10px;
  color: #777;
}

.order-view-button {
  margin-top: 8px;
  width: 100%;
  background: #292930;
  color: white;
  font-size: 12px;
}


/* =========================================================
   MODAL DE DETALHES
   ========================================================= */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 9999;
}

.order-modal {
  width: 100%;
  max-width: 850px;
  max-height: 90vh;
  overflow-y: auto;
  background: #111116;
  border: 1px solid #303039;
  border-radius: 18px;
  box-shadow: 0 20px 80px rgba(0,0,0,.6);
}

.modal-header {
  position: sticky;
  top: 0;
  background: #15151b;
  border-bottom: 1px solid #292930;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 2;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.modal-close {
  background: #292930;
  color: white;
  font-size: 18px;
  width: 40px;
  height: 40px;
  padding: 0;
}

.modal-body {
  padding: 20px;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.detail-box {
  background: #15151b;
  border: 1px solid #292930;
  border-radius: 12px;
  padding: 15px;
}

.detail-box.full {
  grid-column: 1 / -1;
}

.detail-title {
  color: #888;
  font-size: 12px;
  margin-bottom: 7px;
  text-transform: uppercase;
  font-weight: bold;
}

.detail-value {
  font-size: 15px;
  word-break: break-word;
}

.order-items {
  margin-top: 10px;
}

.order-item {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding: 12px 0;
  border-bottom: 1px solid #292930;
}

.order-item:last-child {
  border-bottom: 0;
}

.order-item-name {
  font-weight: bold;
}

.order-item-info {
  color: #999;
  font-size: 12px;
  margin-top: 4px;
}

.order-item-price {
  white-space: nowrap;
  font-weight: bold;
}

.modal-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 15px;
  margin-top: 10px;
  border-top: 1px solid #333;
  font-size: 19px;
  font-weight: bold;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.modal-actions button,
.modal-actions a {
  flex: 1;
  text-align: center;
  text-decoration: none;
}

.whatsapp-button {
  background: #18a558;
  color: white;
  border-radius: 8px;
  padding: 11px 15px;
  font-weight: bold;
}

.copy-button {
  background: #292930;
  color: white;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px) {

  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .row {
    grid-template-columns: 1fr;
  }

  .products-grid {
    grid-template-columns: 1fr;
  }

  .detail-grid {
    grid-template-columns: 1fr;
  }

  .detail-box.full {
    grid-column: auto;
  }

  .modal-actions {
    flex-direction: column;
  }

}

@media(max-width:450px) {

  .stats {
    grid-template-columns: 1fr;
  }

  .modal-overlay {
    padding: 8px;
  }

  .modal-body {
    padding: 15px;
  }

}

</style>

</head>

<script>

const ADMIN_FUNCTION_URL =
  "https://knmwxyxgcgytzhggzhhd.supabase.co/functions/v1/admin-orders";

let adminKey = "";

let products = [];
let productImages = [];
let productVideos = [];
let orders = [];


/* =========================================================
   LOGIN
   ========================================================= */

function login() {

  adminKey =
    document
      .getElementById("adminKey")
      .value
      .trim();

  if (!adminKey) {

    document
      .getElementById("loginError")
      .textContent =
        "Digite sua chave.";

    return;
  }

  loadData();
}


/* =========================================================
   API
   ========================================================= */

async function apiRequest(options = {}) {

  const response =
    await fetch(
      ADMIN_FUNCTION_URL,
      {
        ...options,

        headers: {
          ...(options.headers || {}),
          "x-admin-key":
            adminKey
        }
      }
    );

  const data =
    await response.json();

  if (
    !response.ok ||
    data.success === false
  ) {

    throw new Error(
      data.error ||
      "Erro na requisição."
    );
  }

  return data;
}


/* =========================================================
   CARREGAR
   ========================================================= */

async function loadData() {

  try {

    const data =
      await apiRequest({
        method: "GET"
      });

    orders =
      data.orders || [];

    products =
      data.products || [];

    productImages =
      data.product_images || [];

    productVideos =
      data.product_videos || [];

    document
      .getElementById(
        "loginScreen"
      )
      .classList.add(
        "hidden"
      );

    document
      .getElementById(
        "panel"
      )
      .classList.remove(
        "hidden"
      );

    renderStats();
    renderOrders();
    renderProducts();

  } catch (error) {

    document
      .getElementById(
        "loginError"
      )
      .textContent =
        error.message;

  }
}


/* =========================================================
   ESTATÍSTICAS
   ========================================================= */

function renderStats() {

  const pending =
    orders.filter(
      order =>
        order.status === "pending"
    ).length;


  const paid =
    orders.filter(
      order =>
        order.status === "paid"
    ).length;


  const shipped =
    orders.filter(
      order =>
        order.status === "shipped"
    ).length;


  const delivered =
    orders.filter(
      order =>
        order.status === "delivered"
    ).length;


  const cancelled =
    orders.filter(
      order =>
        order.status === "cancelled"
    ).length;


  const revenueStatuses = [
    "paid",
    "shipped",
    "delivered"
  ];


  const sales =
    orders
      .filter(
        order =>
          revenueStatuses.includes(
            order.status
          )
      )
      .reduce(
        (sum, order) =>
          sum +
          Number(
            order.total || 0
          ),
        0
      );


  document
    .getElementById(
      "totalOrders"
    )
    .textContent =
      orders.length;


  document
    .getElementById(
      "pendingOrders"
    )
    .textContent =
      pending;


  document
    .getElementById(
      "paidOrders"
    )
    .textContent =
      paid;


  document
    .getElementById(
      "shippedOrders"
    )
    .textContent =
      shipped;


  document
    .getElementById(
      "deliveredOrders"
    )
    .textContent =
      delivered;


  document
    .getElementById(
      "cancelledOrders"
    )
    .textContent =
      cancelled;


  document
    .getElementById(
      "totalSales"
    )
    .textContent =
      money(sales);
}


/* =========================================================
   PEDIDOS
   ========================================================= */

function renderOrders() {

  const body =
    document.getElementById(
      "ordersBody"
    );

  body.innerHTML = "";

  orders.forEach(order => {

    const items =
      Array.isArray(
        order.items
      )
        ? order.items
        : [];


    const itemsText =
      items.map(item => {

        return (
          escapeHtml(
            item.name ||
            item.product_name ||
            "Produto"
          ) +
          " x" +
          (item.quantity || 1)
        );

      }).join("<br>");


    const tr =
      document.createElement(
        "tr"
      );


    const address = [

      order.customer_address,

      order.customer_number
        ? "Nº " +
          order.customer_number
        : "",

      order.customer_complement,

      order.customer_cep
        ? "CEP " +
          order.customer_cep
        : ""

    ]
      .filter(Boolean)
      .join(", ");


    const currentStatus =
      order.status || "pending";


    const statusLabels = {

      pending:
        "🟡 PENDENTE",

      paid:
        "🟢 PAGO",

      shipped:
        "📦 ENVIADO",

      delivered:
        "✅ ENTREGUE",

      cancelled:
        "🔴 CANCELADO"

    };


    const safeOrderNsu =
      escapeAttribute(
        order.order_nsu || ""
      );


    const statusHtml = `

      <select
        class="status-select ${escapeAttribute(
          currentStatus
        )}"
        onchange="updateOrderStatus(
          '${safeOrderNsu}',
          this.value
        )"
      >

        <option
          value="pending"
          ${
            currentStatus === "pending"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.pending}
        </option>


        <option
          value="paid"
          ${
            currentStatus === "paid"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.paid}
        </option>


        <option
          value="shipped"
          ${
            currentStatus === "shipped"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.shipped}
        </option>


        <option
          value="delivered"
          ${
            currentStatus === "delivered"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.delivered}
        </option>


        <option
          value="cancelled"
          ${
            currentStatus === "cancelled"
              ? "selected"
              : ""
          }
        >
          ${statusLabels.cancelled}
        </option>

      </select>


      ${
        currentStatus === "paid"
          ? `
            <div class="order-status-info">
              Pagamento confirmado
            </div>
          `
          : ""
      }


      <button
        class="order-view-button"
        onclick="openOrderModal('${safeOrderNsu}')"
      >
        👁️ Ver detalhes
      </button>

    `;


    tr.innerHTML = `

      <td>
        <strong>
          ${escapeHtml(
            order.order_nsu || "-"
          )}
        </strong>
      </td>


      <td>

        <strong>
          ${escapeHtml(
            order.customer_name || "-"
          )}
        </strong>

        <br>

        ${escapeHtml(
          order.customer_email || ""
        )}

        <br>

        ${escapeHtml(
          order.customer_phone || ""
        )}

      </td>


      <td>
        ${escapeHtml(
          address || "-"
        )}
      </td>


      <td>
        ${itemsText || "-"}
      </td>


      <td>
        ${money(order.total)}
      </td>


      <td>
        ${statusHtml}
      </td>


      <td>
        ${formatDate(
          order.created_at
        )}
      </td>

    `;


    body.appendChild(tr);

  });

}


/* =========================================================
   ABRIR DETALHES DO PEDIDO
   ========================================================= */

function openOrderModal(orderNsu) {

  const order =
    orders.find(
      item =>
        String(
          item.order_nsu
        ) ===
        String(
          orderNsu
        )
    );


  if (!order) {

    alert(
      "Pedido não encontrado."
    );

    return;
  }


  const modal =
    document.getElementById(
      "orderModal"
    );


  const body =
    document.getElementById(
      "orderModalBody"
    );


  const items =
    Array.isArray(
      order.items
    )
      ? order.items
      : [];


  const statusLabels = {

    pending:
      "🟡 PENDENTE",

    paid:
      "🟢 PAGO",

    shipped:
      "📦 ENVIADO",

    delivered:
      "✅ ENTREGUE",

    cancelled:
      "🔴 CANCELADO"

  };


  const addressParts = [

    order.customer_address,

    order.customer_number
      ? "Nº " +
        order.customer_number
      : "",

    order.customer_complement,

    order.customer_cep
      ? "CEP " +
        order.customer_cep
      : ""

  ].filter(Boolean);


  const address =
    addressParts.length
      ? addressParts.join(", ")
      : "Não informado";


  const itemsHtml =
    items.length

      ? items.map(item => {

          const name =

/* =========================================================

function closeOrderModal(event) {

  if (
    event &&
    event.target &&
    event.target.id !==
      "orderModal"
  ) {
    return;
  }


  document
    .getElementById(
      "orderModal"
    )
    .classList.add(
      "hidden"
    );
}


/* =========================================================
   COPIAR PEDIDO
   ========================================================= */

async function copyOrder(orderNsu) {

  const order =
    orders.find(
      item =>
        String(
          item.order_nsu
        ) ===
        String(
          orderNsu
        )
    );


  if (!order) {

    alert(
      "Pedido não encontrado."
    );

    return;
  }


  const items =
    Array.isArray(
      order.items
    )
      ? order.items
      : [];


  const itemsText =
    items.map(item => {

      return (
        "- " +
        (
          item.name ||
          item.product_name ||
          "Produto"
        ) +
        " x" +
        (
          item.quantity ||
          1
        )
      );

    }).join("\n");


  const address = [

    order.customer_address,

    order.customer_number
      ? "Nº " +
        order.customer_number
      : "",

    order.customer_complement,

    order.customer_cep
      ? "CEP " +
        order.customer_cep
      : ""

  ]
    .filter(Boolean)
    .join(", ");


  const text =

    "VT STORE - PEDIDO\n\n" +

    "Pedido: " +
    (
      order.order_nsu ||
      "-"
    ) +
    "\n\n" +

    "Cliente: " +
    (
      order.customer_name ||
      "-"
    ) +
    "\n" +

    "Telefone: " +
    (
      order.customer_phone ||
      "-"
    ) +
    "\n" +

    "E-mail: " +
    (
      order.customer_email ||
      "-"
    ) +
    "\n\n" +

    "Endereço: " +
    (
      address ||
      "-"
    ) +
    "\n\n" +

    "Produtos:\n" +
    (
      itemsText ||
      "-"
    ) +
    "\n\n" +

    "Total: " +
    money(order.total) +
    "\n" +

    "Status: " +
    (
      order.status ||
      "-"
    );


  try {

    await navigator.clipboard.writeText(
      text
    );

    alert(
      "✅ Dados do pedido copiados!"
    );

  } catch(error) {

    alert(
      "❌ Não foi possível copiar automaticamente."
    );

  }

}


/* =========================================================
   ATUALIZAR STATUS
   ========================================================= */

async function updateOrderStatus(
  orderNsu,
  status
) {

  if (!orderNsu) {

    alert(
      "❌ Número do pedido não encontrado."
    );

    await loadData();

    return;
  }


  const labels = {

    pending:
      "PENDENTE",

    paid:
      "PAGO",

    shipped:
      "ENVIADO",

    delivered:
      "ENTREGUE",

    cancelled:
      "CANCELADO"

  };


  const confirmChange =
    confirm(
      "Alterar o pedido " +
      orderNsu +
      " para " +
      (
        labels[status] ||
        status
      ) +
      "?"
    );


  if (!confirmChange) {

    await loadData();

    return;
  }


  try {

    await apiRequest({

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body:
        JSON.stringify({

          action:
            "update_order_status",

          order_nsu:
            orderNsu,

          status:
            status

        })

    });


    alert(
      "✅ Status atualizado para " +
      (
        labels[status] ||
        status
      ) +
      "!"
    );


    await loadData();


  } catch(error) {

    alert(
      "❌ " +
      error.message
    );


    await loadData();

  }

}

) {

const input =
document.getElementById(
`stock-${productId}`
);

input.value || 0
);

value += amount;

if (value < 0) {
value = 0;
}

input.value = value;
}

/* =========================================================
NORMALIZAR TELEFONE
========================================================= */

function normalizePhone(
phone
) {

if (!phone) {
return "";
}

let value =
String(
phone
).replace(
/\D/g,
""
);

if (
value.startsWith(
"0"
)
) {
value =
value.substring(
1
);
}

if (
value.length === 10 ||
value.length === 11
) {

```
value =
  "55" +
  value;
```

}

return value;
}

/* =========================================================
UTILIDADES
========================================================= */

function money(value) {

return Number(
value || 0
).toLocaleString(
"pt-BR",
{
style: "currency",
currency: "BRL"
}
);
}

function formatDate(date) {

if (!date) {
return "-";
}

return new Date(
date
).toLocaleString(
"pt-BR"
);
}

function escapeHtml(value) {

return String(
value ?? ""
)
.replaceAll(
"&",
"&"
)
.replaceAll(
"<",
"<"
)
.replaceAll(
">",
">"
)
.replaceAll(
'"',
"""
)
.replaceAll(
"'",
"'"
);
}

function escapeAttribute(value) {
return escapeHtml(value);
}
