<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VT Store - Painel Administrativo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0f;
      color: #fff;
    }

    header {
      background: #111116;
      border-bottom: 1px solid #27272d;
      padding: 18px 25px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header span {
      color: #999;
      font-size: 13px;
    }

    .container {
      width: 95%;
      max-width: 1400px;
      margin: 25px auto;
    }

    .login {
      max-width: 450px;
      margin: 100px auto;
      background: #15151b;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #292930;
    }

    .login h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0d0d12;
      color: #fff;
      border: 1px solid #303039;
      padding: 11px;
      border-radius: 8px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #5555ff;
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-size: 13px;
      color: #aaa;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .btn-primary {
      background: #5b5cff;
      color: #fff;
    }

    .btn-green {
      background: #18a558;
      color: #fff;
    }

    .btn-red {
      background: #d93636;
      color: #fff;
    }

    .btn-gray {
      background: #292930;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .error {
      background: #3a1515;
      border: 1px solid #733030;
      padding: 12px;
      border-radius: 8px;
      color: #ff9a9a;
      margin-top: 12px;
    }

    .success {
      background: #12331f;
      border: 1px solid #246b3d;
      padding: 12px;
      border-radius: 8px;
      color: #8ff0af;
      margin-top: 12px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #15151b;
      border: 1px solid #292930;
      border-radius: 14px;
      padding: 20px;
    }

    .stat small {
      color: #999;
    }

    .stat strong {
      display: block;
      margin-top: 8px;
      font-size: 26px;
    }

    .section {
      background: #111116;
      border: 1px solid #292930;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .section-title h2 {
      margin: 0;
    }

    .orders {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 13px 10px;
      border-bottom: 1px solid #292930;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #aaa;
      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    .status-paid {
      color: #4be083;
      font-weight: bold;
    }

    .status-pending {
      color: #ffcc66;
      font-weight: bold;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: #15151b;
      border: 1px solid #292930;
      border-radius: 15px;
      overflow: hidden;
    }

    .product-header {
      padding: 16px;
      border-bottom: 1px solid #292930;
    }

    .product-header h3 {
      margin: 0 0 5px;
      font-size: 18px;
    }

    .product-id {
      font-size: 11px;
      color: #777;
      word-break: break-all;
    }

    .photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
    }

    .photo {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #0d0d12;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #292930;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo button {
      position: absolute;
      right: 5px;
      top: 5px;
      padding: 5px 7px;
      font-size: 11px;
      background: #d93636;
      color: white;
    }

    .no-photo {
      grid-column: 1 / -1;
      padding: 25px 10px;
      text-align: center;
      color: #777;
      border: 1px dashed #333;
      border-radius: 8px;
    }

    .product-body {
      padding: 16px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stock-control {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .stock-control input {
      text-align: center;
    }

    .stock-control button {
      min-width: 42px;
      padding: 10px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .upload-box {
      margin-top: 15px;
      padding: 12px;
      border: 1px dashed #3b3b44;
      border-radius: 10px;
    }

    .upload-box input[type="file"] {
      border: 0;
      padding: 5px 0;
      background: transparent;
    }

    .active-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .active-box input {
      width: auto;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #aaa;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: 1fr;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .container {
        width: 94%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>VT Store — Painel Administrativo</h1>
  <span>Gerencie pedidos, produtos, estoque e fotos</span>
</header>

<div id="loginScreen" class="login">

  <h2>Entrar no painel</h2>

  <label>Chave administrativa</label>

  <input
    type="password"
    id="adminKey"
    placeholder="Digite sua chave"
  >

  <button
    class="btn-primary"
    style="width:100%; margin-top:15px;"
    onclick="login()"
  >
    Entrar
  </button>

  <div id="loginError" class="error hidden"></div>

</div>

<div id="panel" class="container hidden">

  <div class="stats">

    <div class="stat">
      <small>Total de pedidos</small>
      <strong id="totalOrders">0</strong>
    </div>

    <div class="stat">
      <small>Pedidos pagos</small>
      <strong id="paidOrders">0</strong>
    </div>

    <div class="stat">
      <small>Total vendido</small>
      <strong id="totalSales">R$ 0,00</strong>
    </div>

  </div>

  <!-- PEDIDOS -->

  <section class="section">

    <div class="section-title">

      <h2>📦 Pedidos</h2>

      <button
        class="btn-gray"
        onclick="loadData()"
      >
        Atualizar
      </button>

    </div>

    <div class="orders">

      <table>

        <thead>
          <tr>
            <th>Pedido</th>
            <th>Cliente</th>
            <th>Endereço</th>
            <th>Produtos</th>
            <th>Valor</th>
            <th>Status</th>
            <th>Data</th>
          </tr>
        </thead>

        <tbody id="ordersBody">
        </tbody>

      </table>

    </div>

  </section>

  <!-- PRODUTOS -->

  <section class="section">

    <div class="section-title">

      <h2>🛒 Produtos</h2>

      <button
        class="btn-gray"
        onclick="loadData()"
      >
        Atualizar produtos
      </button>

    </div>

    <div
      id="productsGrid"
      class="products-grid"
    ></div>

  </section>

</div>

<script>

const ADMIN_FUNCTION_URL =
  "https://knmwxyxgcgytzhggzhhd.supabase.co/functions/v1/admin-orders";

let adminKey = "";

let products = [];
let productImages = [];
let orders = [];


/* ============================================================
   LOGIN
   ============================================================ */

function login() {

  const key =
    document.getElementById("adminKey").value.trim();

  if (!key) {
    showLoginError("Digite sua chave administrativa.");
    return;
  }

  adminKey = key;

  loadData();

}


/* ============================================================
   ERRO LOGIN
   ============================================================ */

function showLoginError(message) {

  const el =
    document.getElementById("loginError");

  el.textContent = message;

  el.classList.remove("hidden");

}


/* ============================================================
   REQUISIÇÃO
   ============================================================ */

async function apiRequest(
  options = {}
) {

  const response =
    await fetch(
      ADMIN_FUNCTION_URL,
      {
        ...options,

        headers: {
          ...(options.headers || {}),
          "x-admin-key": adminKey
        }
      }
    );

  const data =
    await response.json();

  if (!response.ok || data.success === false) {

    throw new Error(
      data.error ||
      "Erro na comunicação com o servidor."
    );

  }

  return data;

}


/* ============================================================
   CARREGAR TUDO
   ============================================================ */

async function loadData() {

  try {

    const data =
      await apiRequest({
        method: "GET"
      });

    orders =
      data.orders || [];

    products =
      data.products || [];

    productImages =
      data.product_images || [];

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("panel")
      .classList.remove("hidden");

    renderStats();

    renderOrders();

    renderProducts();

  } catch (error) {

    console.error(error);

    if (
      document
        .getElementById("panel")
        .classList.contains("hidden")
    ) {

      showLoginError(
        error.message
      );

    } else {

      alert(
        "Erro: " + error.message
      );

    }

  }

}


/* ============================================================
   ESTATÍSTICAS
   ============================================================ */

function renderStats() {

  const paid =
    orders.filter(
      order => order.status === "paid"
    );

  const sales =
    paid.reduce(
      (sum, order) =>
        sum + Number(order.total || 0),
      0
    );

  document
    .getElementById("totalOrders")
    .textContent =
      orders.length;

  document
    .getElementById("paidOrders")
    .textContent =
      paid.length;

  document
    .getElementById("totalSales")
    .textContent =
      money(sales);

}


/* ============================================================
   PEDIDOS
   ============================================================ */

function renderOrders() {

  const tbody =
    document.getElementById(
      "ordersBody"
    );

  tbody.innerHTML = "";

  if (!orders.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="7">
          Nenhum pedido encontrado.
        </td>
      </tr>
    `;

    return;
  }

  orders.forEach(order => {

    const tr =
      document.createElement("tr");

    const items =
      Array.isArray(order.items)
        ? order.items
        : [];

    const productsText =
      items.map(item => {

        const name =
          item.name ||
          item.product_name ||
          "Produto";

        const quantity =
          item.quantity || 1;

        return `${name} x${quantity}`;

      }).join("<br>");

    const statusClass =
      order.status === "paid"
        ? "status-paid"
        : "status-pending";

    const statusText =
      order.status === "paid"
        ? "PAGO"
        : "PENDENTE";

    const address = [

      order.customer_address,

      order.customer_number
        ? "Nº " + order.customer_number
        : "",

      order.customer_complement,

      order.customer_cep
        ? "CEP " + order.customer_cep
        : ""

    ]
      .filter(Boolean)
      .join(", ");

    tr.innerHTML = `

      <td>
        <strong>${escapeHtml(
          order.order_nsu || "-"
        )}</strong>
      </td>

      <td>
        <strong>${escapeHtml(
          order.customer_name || "-"
        )}</strong>

        <br>

        ${escapeHtml(
          order.customer_email || ""
        )}

        <br>

        ${escapeHtml(
          order.customer_phone || ""
        )}
      </td>

      <td>
        ${escapeHtml(
          address || "-"
        )}
      </td>

      <td>
        ${productsText || "-"}
      </td>

      <td>
        <strong>
          ${money(order.total)}
        </strong>
      </td>

      <td>
        <span class="${statusClass}">
          ${statusText}
        </span>
      </td>

      <td>
        ${formatDate(
          order.created_at
        )}
      </td>

    `;

    tbody.appendChild(tr);

  });

}


/* ============================================================
   PRODUTOS
   ============================================================ */

function renderProducts() {

  const grid =
    document.getElementById(
      "productsGrid"
    );

  grid.innerHTML = "";

  if (!products.length) {

    grid.innerHTML = `
      <div class="loading">
        Nenhum produto encontrado.
      </div>
    `;

    return;
  }

  products.forEach(product => {

    grid.appendChild(
      createProductCard(product)
    );

  });

}


/* ============================================================
   CARD DO PRODUTO
   ============================================================ */

function createProductCard(product) {

  const card =
    document.createElement("div");

  card.className =
    "product-card";

  const images =
    productImages.filter(
      image =>
        String(image.product_id) ===
        String(product.id)
    );

  const photosHtml =
    images.length
      ? images.map(image => `

          <div class="photo">

            <img
              src="${escapeAttribute(
                image.image_url
              )}"
              alt="${escapeAttribute(
                product.name || "Produto"
              )}"
            >

            <button
              onclick="deleteImage(
                '${escapeAttribute(product.id)}',
                '${escapeAttribute(image.image_url)}'
              )"
            >
              X
            </button>

          </div>

        `).join("")
      : `
        <div class="no-photo">
          📷 Nenhuma foto cadastrada
        </div>
      `;

  card.innerHTML = `

    <div class="product-header">

      <h3>
        ${escapeHtml(
          product.name ||
          "Produto sem nome"
        )}
      </h3>

      <div class="product-id">
        ID: ${escapeHtml(
          product.id
        )}
      </div>

    </div>

    <div class="photos">

      ${photosHtml}

    </div>

    <div class="product-body">

      <div class="row">

        <div>

          <label>Nome</label>

          <input
            id="name-${product.id}"
            value="${escapeAttribute(
              product.name || ""
            )}"
          >

        </div>

        <div>

          <label>Categoria</label>

          <input
            id="category-${product.id}"
            value="${escapeAttribute(
              product.category || ""
            )}"
          >

        </div>

      </div>

      <label>Descrição</label>

      <textarea
        id="description-${product.id}"
      >${escapeHtml(
        product.description || ""
      )}</textarea>

      <div class="row">

        <div>

          <label>Preço</label>

          <input
            type="number"
            step="0.01"
            min="0"
            id="price-${product.id}"
            value="${Number(
              product.price || 0
            ).toFixed(2)}"
          >

        </div>

        <div>

          <label>Estoque</label>

          <div class="stock-control">

            <button
              class="btn-red"
              onclick="changeStock(
                '${product.id}',
                -1
              )"
            >
              −
            </button>

            <input
              type="number"
              min="0"
              id="stock-${product.id}"
              value="${Number(
                product.stock || 0
              )}"
            >

            <button
              class="btn-green"
              onclick="changeStock(
                '${product.id}',
                1
              )"
            >
              +
            </button>

          </div>

        </div>

      </div>

      <div class="active-box">

        <input
          type="checkbox"
          id="active-${product.id}"
          ${product.active ? "checked" : ""}
        >

        <label
          for="active-${product.id}"
          style="margin:0"
        >
          Produto ativo no site
        </label>

      </div>

      <div class="active-box">

        <input
          type="checkbox"
          id="promotion-${product.id}"
          ${product.promotion ? "checked" : ""}
        >

        <label
          for="promotion-${product.id}"
          style="margin:0"
        >
          Produto em promoção
        </label>

      </div>

      <div class="actions">

        <button
          class="btn-primary"
          onclick="saveProduct(
            '${product.id}'
          )"
        >
          💾 Salvar alterações
        </button>

      </div>

      <div class="upload-box">

        <label>
          📸 Adicionar foto
        </label>

        <input
          type="file"
          accept="image/*"
          id="file-${product.id}"
        >

        <button
          class="btn-green"
          style="margin-top:10px;width:100%;"
          onclick="uploadImage(
            '${product.id}'
          )"
        >
          Enviar foto
        </button>

      </div>

    </div>

  `;

  return card;

}


/* ============================================================
   ALTERAR ESTOQUE
   ============================================================ */

function changeStock(
  productId,
  amount
) {

  const input =
    document.getElementById(
      `stock-${productId}`
    );

  let value =
    Number(input.value || 0);

  value += amount;

  if (value < 0) {
    value = 0;
  }

  input.value = value;

}


/* ============================================================
   SALVAR PRODUTO
   ============================================================ */

async function saveProduct(
  productId
) {

  try {

    const name =
      document.getElementById(
        `name-${productId}`
      ).value;

    const category =
      document.getElementById(
        `category-${productId}`
      ).value;

    const description =
      document.getElementById(
        `description-${productId}`
      ).value;

    const price =
      Number(
        document.getElementById(
          `price-${productId}`
        ).value
      );

    const stock =
      Number(
        document.getElementById(
          `stock-${productId}`
        ).value
      );

    const active =
      document.getElementById(
        `active-${productId}`
      ).checked;

    const promotion =
      document.getElementById(
        `promotion-${productId}`
      ).checked;

    const data =
      await apiRequest({

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({

          action:
            "update_product",

          product_id:
            productId,

          name,
          category,
          description,
          price,
          stock,
          active,
          promotion

        })

      });

    alert(
      "✅ Produto atualizado com sucesso!"
    );

    await loadData();

  } catch (error) {

    alert(
      "❌ Erro: " +
      error.message
    );

  }

}


/* ============================================================
   UPLOAD FOTO
   ============================================================ */

async function uploadImage(
  productId
) {

  const input =
    document.getElementById(
      `file-${productId}`
    );

  if (!input.files.length) {

    alert(
      "Selecione uma foto primeiro."
    );

    return;
  }

  const file =
    input.files[0];

  try {

    const formData =
      new FormData();

    formData.append(
      "action",
      "upload_image"
    );

    formData.append(
      "product_id",
      productId
    );

    formData.append(
      "file",
      file
    );

    await apiRequest({

      method: "POST",

      body: formData

    });

    alert(
      "✅ Foto adicionada com sucesso!"
    );

    await loadData();

  } catch (error) {

    alert(
      "❌ Erro ao enviar foto: " +
      error.message
    );

  }

}


/* ============================================================
   EXCLUIR FOTO
   ============================================================ */

async function deleteImage(
  productId,
  imageUrl
) {

  const confirmed =
    confirm(
      "Tem certeza que deseja excluir esta foto?"
    );

  if (!confirmed) {
    return;
  }

  try {

    await apiRequest({

      method: "POST",

      headers: {
        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({

        action:
          "delete_image",

        product_id:
          productId,

        image_url:
          imageUrl

      })

    });

    alert(
      "✅ Foto excluída."
    );

    await loadData();

  } catch (error) {

    alert(
      "❌ Erro: " +
      error.message
    );

  }

}


/* ============================================================
   FORMATAÇÃO
   ============================================================ */

function money(value) {

  return Number(
    value || 0
  ).toLocaleString(
    "pt-BR",
    {
      style: "currency",
      currency: "BRL"
    }
  );

}


function formatDate(date) {

  if (!date) {
    return "-";
  }

  return new Date(
    date
  ).toLocaleString(
    "pt-BR"
  );

}


/* ============================================================
   SEGURANÇA HTML
   ============================================================ */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHtml(value);

}


/* ============================================================
   ENTER NO LOGIN
   ============================================================ */

document
  .getElementById("adminKey")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        login();
      }

    }
  );

</script>

</body>
</html>
